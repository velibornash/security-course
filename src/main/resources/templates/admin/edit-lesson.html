<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Izmena lekcije')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Izmena lekcije</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card p-4">
        <form th:action="@{/admin/lesson/{id}/edit(id=${lesson.id})}" method="post" enctype="multipart/form-data" id="lessonForm">
            <div class="mb-3">
                <label class="form-label">Naslov</label>
                <input type="text" name="title" class="form-control" th:value="${lesson.title}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Sadržaj lekcije</label>
                <textarea name="content" id="contentArea" th:text="${lesson.content}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Opciona naslovna slika (iznad celog teksta)</label>
                <div th:if="${lesson.imagePath}" class="mb-2">
                    <img th:src="${lesson.imagePath}" style="max-height:120px" class="rounded border">
                    <div class="form-check mt-1">
                        <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage">
                        <label class="form-check-label text-danger" for="removeImage">Obriši naslovnu sliku</label>
                    </div>
                </div>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">Sačuvaj izmene</button>
            <a href="/admin" class="btn btn-outline-secondary">Nazad</a>
            <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-outline-info" target="_blank">Pogledaj lekciju</a>
        </form>
    </div>
</div>

<!-- Summernote (free WYSIWYG editor) -->
<link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/lang/summernote-sr-Latn.js"></script>

<script th:inline="javascript">
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';

    $(document).ready(function () {
        $.extend($.summernote.plugins, {
            'imageResize': function (context) {
                var ui = $.summernote.ui;
                var $image;

                context.invoke('editor.createNodeObserver', {
                    callback: function (mutations) {
                        mutations.forEach(function (mutation) {
                            $(mutation.addedNodes).each(function () {
                                if ($(this).is('img')) {
                                    bindResize($(this));
                                }
                            });
                        });
                    },
                    subtree: true,
                    childList: true
                });

                function bindResize($img) {
                    $img.off('click').on('click', function (e) {
                        e.preventDefault();
                        $image = $(this);
                        showResizeMenu($image);
                    });
                }

                function showResizeMenu($img) {
                    var widths = {
                        '25%': '25%', '33%': '33%', '50%': '50%',
                        '75%': '75%', '100%': '100%'
                    };
                    var currentWidth = $img.css('width') || $img.attr('width') || 'auto';

                    var html = '<div class="p-2" style="min-width:180px">';
                    html += '<p class="fw-bold mb-2">Veličina slike</p>';
                    html += '<div class="d-flex flex-wrap gap-1 mb-2">';
                    Object.keys(widths).forEach(function (label) {
                        var active = (currentWidth === widths[label]) ? 'btn-primary' : 'btn-outline-primary';
                        html += '<button class="btn btn-sm ' + active + ' img-size-btn" data-width="' + widths[label] + '">' + label + '</button>';
                    });
                    html += '</div>';
                    html += '<div class="input-group input-group-sm mb-2">';
                    html += '<span class="input-group-text">px</span>';
                    html += '<input type="number" class="form-control" id="customImgWidth" value="' + ($img.width() || '') + '" placeholder="širina">';
                    html += '</div>';
                    html += '<button class="btn btn-sm btn-success w-100" id="applyImgSize">Primeni</button>';
                    html += '<button class="btn btn-sm btn-danger w-100 mt-1" id="removeImg">Obriši sliku</button>';
                    html += '</div>';

                    var $popover = $('<div class="img-resize-popover" style="position:absolute;z-index:9999;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);"></div>');
                    $popover.html(html);

                    var offset = $img.offset();
                    $popover.css({ top: offset.top + $img.outerHeight() + 5, left: offset.left });
                    $('body').append($popover);

                    $popover.find('.img-size-btn').on('click', function () {
                        $img.css('width', $(this).data('width'));
                        $img.css('height', 'auto');
                        $popover.remove();
                    });

                    $popover.find('#applyImgSize').on('click', function () {
                        var w = $popover.find('#customImgWidth').val();
                        if (w) {
                            $img.css('width', w + 'px');
                            $img.css('height', 'auto');
                        }
                        $popover.remove();
                    });

                    $popover.find('#removeImg').on('click', function () {
                        $img.remove();
                        $popover.remove();
                    });

                    $(document).on('click.imgResize', function (e) {
                        if (!$popover.is(e.target) && !$popover.has(e.target).length && !$img.is(e.target)) {
                            $popover.remove();
                            $(document).off('click.imgResize');
                        }
                    });
                }
            }
        });

        $('#contentArea').summernote({
            lang: 'sr-Latn',
            height: 500,
            placeholder: 'Pišite sadržaj lekcije ovde...',
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'strikethrough', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture', 'video']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ],
            plugins: ['imageResize'],
            callbacks: {
                onImageUpload: function (files) {
                    uploadImage(files[0], this);
                },
                onPaste: function (e) {
                    var bufferText = ((e.originalEvent || e).clipboardData || window.clipboardData).getData('text/html');
                    if (bufferText && bufferText.includes('<img')) {
                        e.preventDefault();
                    }
                },
                onInit: function () {
                    setTimeout(function () {
                        $('.note-editable').find('img').each(function () {
                            $(this).css('cursor', 'pointer');
                        });
                    }, 500);
                }
            }
        });
    });

    function uploadImage(file, editor) {
        var formData = new FormData();
        formData.append('file', file);

        $.ajax({
            url: '/admin/upload-image',
            method: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: { [csrfHeader]: csrfToken },
            success: function (data) {
                $(editor).summernote('insertImage', data.url, function ($image) {
                    $image.css('max-width', '100%');
                    $image.css('cursor', 'pointer');
                    $image.attr('alt', 'slika');
                });
            },
            error: function (err) {
                alert('Greška pri uploadu slike: ' + (err.responseText || 'nepoznata greška'));
            }
        });
    }
</script>
</body>
</html>
