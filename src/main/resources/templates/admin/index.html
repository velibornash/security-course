<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Admin panel – Upravljanje kursom</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="mb-4">
        <a href="/admin/quiz" class="btn btn-warning">
            <i class="bi bi-pencil-square"></i> Upravljanje pitanjima kviza
        </a>
    </div>

    <!-- BACKUP/INIT -->
    <div class="card mb-4 border-secondary">
        <div class="card-header bg-secondary text-white fw-bold">Sigurnosne kopije</div>
        <div class="card-body">
            <div class="d-flex gap-2 flex-wrap">
                <form th:action="@{/admin/backup}" method="post">
                    <button class="btn btn-outline-primary" type="submit">
                        <i class="fas fa-save"></i> Backup trenutno stanje
                    </button>
                </form>
                <form th:action="@{/admin/init-course}" method="post"
                      onsubmit="return confirm('Vratiti kurs iz backupa? Sve trenutne izmene biće obrisane.')">
                    <button class="btn btn-outline-danger" type="submit">
                        <i class="fas fa-redo"></i> Inicijalizuj kurs iz backupa
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ADD NEW SECTION -->
    <div class="card mb-4 border-primary">
        <div class="card-header bg-primary text-white fw-bold">+ Nova sekcija</div>
        <div class="card-body">
            <form th:action="@{/admin/section/add}" method="post" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Naslov sekcije</label>
                    <input type="text" name="title" class="form-control" placeholder="npr. Nova tema" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Opis (opciono)</label>
                    <input type="text" name="description" class="form-control" placeholder="Kratak opis">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Redosled</label>
                    <input type="number" name="sortOrder" class="form-control" value="99">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Dodaj sekciju</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EXISTING SECTIONS -->
    <div th:each="section : ${sections}" class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <strong th:text="${section.title}">Sekcija</strong>
                <small class="text-muted ms-2" th:text="'ID: ' + ${section.id}"></small>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <form th:action="@{/admin/section/{id}/edit(id=${section.id})}" method="post" class="d-flex gap-1 align-items-center">
                    <input type="text" name="title" th:value="${section.title}" class="form-control form-control-sm" style="width:180px" required>
                    <input type="hidden" name="description" th:value="${section.description}">
                    <input type="number" name="sortOrder" th:value="${section.sortOrder}" class="form-control form-control-sm" style="width:70px">
                    <button class="btn btn-sm btn-outline-secondary" title="Sačuvaj sekciju">Sačuvaj</button>
                </form>
                <form th:action="@{/admin/section/{id}/delete(id=${section.id})}" method="post"
                      onsubmit="return confirm('Obrisati sekciju i sve njene lekcije?')">
                    <button class="btn btn-sm btn-outline-danger">Obriši sekciju</button>
                </form>
            </div>
        </div>

        <ul class="list-group list-group-flush">
            <li th:each="lesson : ${section.lessons}" class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <span th:text="${lesson.sortOrder} + '. ' + ${lesson.title}">Lekcija</span>
                    <span th:if="${lesson.imagePath}" class="badge bg-info ms-2">ima sliku</span>
                </div>
                <div>
                    <a th:href="@{/admin/lesson/{id}/edit(id=${lesson.id})}" class="btn btn-sm btn-outline-primary">Izmeni</a>
                    <a th:href="@{/admin/lesson/{id}/exercises(id=${lesson.id})}" class="btn btn-sm btn-outline-success">Vežbe</a>
                    <form th:action="@{/admin/lesson/{id}/delete(id=${lesson.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Obrisati lekciju?')">
                        <button class="btn btn-sm btn-outline-danger">Obriši</button>
                    </form>
                </div>
            </li>
            <li th:if="${#lists.isEmpty(section.lessons)}" class="list-group-item text-muted">Nema lekcija</li>
        </ul>

        <div class="card-body">
            <form th:action="@{/admin/lesson/add}" method="post" class="row g-2">
                <input type="hidden" name="sectionId" th:value="${section.id}">
                <div class="col-md-4">
                    <input type="text" name="title" class="form-control form-control-sm" placeholder="Naslov nove lekcije" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="content" class="form-control form-control-sm" placeholder="Početni tekst" value="<p>Novi sadržaj...</p>">
                </div>
                <div class="col-md-2">
                    <input type="number" name="sortOrder" class="form-control form-control-sm" placeholder="Redosled" value="99">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-sm btn-success w-100">+ Dodaj lekciju</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
