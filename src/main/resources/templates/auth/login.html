<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Prijava')}"></head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center mb-4">Prijava</h3>
                <div th:if="${param.error}" class="alert alert-danger">Pogrešan email ili lozinka</div>
                <div th:if="${param.logout}" class="alert alert-success">Uspešno ste se odjavili</div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lozinka</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Prijavi se</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Nemate nalog? <a th:href="@{/register}">Registrujte se</a>
                </p>
                <hr>
                <small class="text-muted">
                    Demo: admin@expo.rs / admin123<br>
                    Demo: user@expo.rs / user123
                </small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
