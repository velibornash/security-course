<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card p-4 mb-4">
        <h2 class="mb-1">Bezbednost u restriktivnim zonama — Expo 2027</h2>
        <p class="text-muted mb-3">Profesionalna uvodna obuka za akreditovana lica</p>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <span>Napredak: <strong th:text="${completed} + ' / ' + ${total}">0 / 0</strong> lekcija</span>
            <span th:text="${progressPercent} + '%'">0%</span>
        </div>
        <div class="progress mb-3">
            <div class="progress-bar" role="progressbar"
                 th:style="'width:' + ${progressPercent} + '%'"
                 th:aria-valuenow="${progressPercent}" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <a th:if="${progressPercent == 100}" href="/quiz" class="btn btn-success">
            <i class="bi bi-clipboard-check"></i> Završni test
        </a>
        <a th:unless="${progressPercent == 100}" href="/quiz" class="btn btn-outline-secondary">
            Završni test (preporučeno nakon svih lekcija)
        </a>
    </div>

    <h4 class="mb-3">Sadržaj kursa</h4>
    <div th:each="section : ${sections}" class="card mb-3">
        <div class="card-header fw-bold" th:text="${section.title}">Sekcija</div>
        <ul class="list-group list-group-flush">
            <li th:each="lesson : ${section.lessons}" class="list-group-item d-flex justify-content-between align-items-center">
                <a th:href="@{/lesson/{id}(id=${lesson.id})}" th:text="${lesson.title}" class="text-decoration-none">Lekcija</a>
                <i class="bi bi-chevron-right text-muted"></i>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
