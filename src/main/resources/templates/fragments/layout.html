<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Expo 2027 Security'">Expo 2027</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .navbar { background: #1e3c72 !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .progress { height: 10px; }
        .lesson-content img { max-width: 100%; border-radius: 8px; }
        .btn-primary { background: #1e3c72; border-color: #1e3c72; }
        .btn-primary:hover { background: #152c54; border-color: #152c54; }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">Expo 2027 Security</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50" sec:authentication="name"></span>
            <a sec:authorize="hasRole('ADMIN')" href="/admin" class="btn btn-sm btn-outline-light">Admin</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-sm btn-outline-light">Odjava</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
