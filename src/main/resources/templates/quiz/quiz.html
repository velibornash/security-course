<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Završni test')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card p-4">
        <h2 class="mb-2">Završni test</h2>
        <p class="text-muted">Za prolaz potrebno je tačno odgovoriti na <strong>9 od 10</strong> pitanja (90%).</p>
        <hr>

        <form th:action="@{/quiz/submit}" method="post">
            <div th:each="q, iter : ${questions}" class="mb-4">
                <p class="fw-bold" th:text="${iter.count} + '. ' + ${q.questionText}">Pitanje</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:name="'q_' + ${q.id}" th:value="A" th:id="'q'+${q.id}+'A'" required>
                    <label class="form-check-label" th:for="'q'+${q.id}+'A'" th:text="'A) ' + ${q.optionA}"></label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:name="'q_' + ${q.id}" th:value="B" th:id="'q'+${q.id}+'B'">
                    <label class="form-check-label" th:for="'q'+${q.id}+'B'" th:text="'B) ' + ${q.optionB}"></label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" th:name="'q_' + ${q.id}" th:value="C" th:id="'q'+${q.id}+'C'">
                    <label class="form-check-label" th:for="'q'+${q.id}+'C'" th:text="'C) ' + ${q.optionC}"></label>
                </div>
                <div class="form-check" th:if="${q.optionD}">
                    <input class="form-check-input" type="radio" th:name="'q_' + ${q.id}" th:value="D" th:id="'q'+${q.id}+'D'">
                    <label class="form-check-label" th:for="'q'+${q.id}+'D'" th:text="'D) ' + ${q.optionD}"></label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Predaj test</button>
        </form>
    </div>
</div>
</body>
</html>
